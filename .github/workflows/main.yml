name: Affitti Torino

on:
  schedule:
    # Ogni giorno alle 19:00 Europe/Rome
    - cron: "0 17 * * *" # GitHub usa UTC, quindi 17 = 19 Europe/Rome
  workflow_dispatch: # permette anche il test manuale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run bot
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python bot_affitti.py
